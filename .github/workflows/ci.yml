name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: xiaomiao/requirements.txt

      - name: Install xiaomiao test dependencies
        run: python -m pip install pytest pytest-asyncio -r xiaomiao/requirements.txt

      - name: Test xiaomiao
        run: python -m pytest test/xiaomiao -q

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          working-directory: xiaomiaoAgent

      - name: Test Agent config paths
        working-directory: xiaomiaoAgent
        run: uv run --frozen --extra dev pytest tests/config/test_config_paths.py -q

  stage-web:
    name: Stage web typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: xiaomiaobot/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir xiaomiaobot install --frozen-lockfile

      - name: Typecheck stage-web
        run: pnpm --dir xiaomiaobot -F @proj-airi/stage-web typecheck
