<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiaomiaoVirtual 服务监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .dashboard {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .services {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 40px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .service-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .service-item.running {
            border-color: #4ade80;
        }

        .service-item.stopped {
            border-color: #ef4444;
        }

        .service-item.warning {
            border-color: #fbbf24;
        }

        .service-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .service-name {
            font-size: 16px;
            font-weight: 500;
        }

        .service-port {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-indicator {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .status-indicator.running {
            background: #4ade80;
            animation: pulse-green 2s infinite;
        }

        .status-indicator.stopped {
            background: #ef4444;
        }

        .status-indicator.warning {
            background: #fbbf24;
            animation: pulse-yellow 2s infinite;
        }

        @keyframes pulse-green {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(74, 222, 128, 0);
            }
        }

        @keyframes pulse-yellow {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(251, 191, 36, 0);
            }
        }

        .status-icon {
            font-size: 20px;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-dot.running { background: #4ade80; }
        .legend-dot.stopped { background: #ef4444; }
        .legend-dot.warning { background: #fbbf24; }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 xiaomiaoVirtual 服务监控面板</h1>

        <div class="dashboard">
            <canvas id="connectionCanvas"></canvas>

            <div class="services" id="servicesContainer">
                <!-- 服务项将由 JavaScript 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="runningCount">0</div>
                <div class="stat-label">运行中</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stoppedCount">0</div>
                <div class="stat-label">已停止</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warningCount">0</div>
                <div class="stat-label">警告</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uptime">0s</div>
                <div class="stat-label">运行时间</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot running"></div>
                <span>运行正常</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot warning"></div>
                <span>需要注意</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot stopped"></div>
                <span>已停止</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="checkAllServices()">🔄 刷新状态</button>
            <button onclick="startAllServices()">▶️ 启动所有</button>
            <button onclick="stopAllServices()">⏹️ 停止所有</button>
        </div>
    </div>

    <script>
        // 服务配置
        const services = [
            {
                id: 'napcat',
                name: 'NapCat (QQ协议)',
                port: '5004',
                dependencies: [],
                checkUrl: 'http://127.0.0.1:5004'
            },
            {
                id: 'agent-api',
                name: 'xiaomiaoAgent API',
                port: '8900',
                dependencies: [],
                checkUrl: 'http://127.0.0.1:8900/health'
            },
            {
                id: 'xiaomiao-bridge',
                name: '小喵桌面桥接',
                port: '5519',
                dependencies: ['agent-api'],
                checkUrl: 'http://127.0.0.1:5519'
            },
            {
                id: 'xiaomiao-bot',
                name: 'QQ Bot (xiaomiao)',
                port: '-',
                dependencies: ['napcat', 'agent-api'],
                checkUrl: null
            },
            {
                id: 'stage-web',
                name: 'xiaomiaobot Web界面',
                port: '5175',
                dependencies: ['xiaomiao-bridge'],
                checkUrl: 'http://127.0.0.1:5175'
            },
            {
                id: 'stage-tamagotchi',
                name: '桌面端 (Electron)',
                port: '-',
                dependencies: ['xiaomiao-bridge'],
                checkUrl: null
            },
            {
                id: 'stage-pocket',
                name: '移动端',
                port: '-',
                dependencies: ['xiaomiao-bridge'],
                checkUrl: null
            },
            {
                id: 'tui',
                name: 'TUI 终端',
                port: '-',
                dependencies: ['agent-api'],
                checkUrl: null
            }
        ];

        let serviceStates = {};
        let startTime = Date.now();

        // 初始化服务状态
        services.forEach(service => {
            serviceStates[service.id] = 'stopped';
        });

        // 渲染服务列表
        function renderServices() {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            services.forEach((service, index) => {
                const state = serviceStates[service.id];
                const item = document.createElement('div');
                item.className = `service-item ${state}`;
                item.id = `service-${service.id}`;

                item.innerHTML = `
                    <div class="service-info">
                        <div class="status-indicator ${state}">
                            <span class="status-icon">${getStatusIcon(state)}</span>
                        </div>
                        <div>
                            <div class="service-name">${service.name}</div>
                            <div class="service-port">端口: ${service.port}</div>
                        </div>
                    </div>
                `;

                item.onclick = () => toggleService(service.id);
                container.appendChild(item);
            });

            updateStats();
            drawConnections();
        }

        function getStatusIcon(state) {
            switch(state) {
                case 'running': return '✓';
                case 'warning': return '⚠';
                case 'stopped': return '○';
                default: return '○';
            }
        }

        // 绘制连接线
        function drawConnections() {
            const canvas = document.getElementById('connectionCanvas');
            const container = document.querySelector('.dashboard');

            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            services.forEach(service => {
                if (service.dependencies.length === 0) return;

                const sourceEl = document.getElementById(`service-${service.id}`);
                if (!sourceEl) return;

                const sourceRect = sourceEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                service.dependencies.forEach(depId => {
                    const targetEl = document.getElementById(`service-${depId}`);
                    if (!targetEl) return;

                    const targetRect = targetEl.getBoundingClientRect();

                    // 计算相对于 canvas 的坐标
                    const sourceX = sourceRect.left - containerRect.left + 20;
                    const sourceY = sourceRect.top - containerRect.top + sourceRect.height / 2;
                    const targetX = targetRect.right - containerRect.left - 20;
                    const targetY = targetRect.top - containerRect.top + targetRect.height / 2;

                    // 绘制连接线
                    ctx.beginPath();
                    ctx.moveTo(targetX, targetY);

                    // 使用贝塞尔曲线
                    const midX = (sourceX + targetX) / 2;
                    ctx.bezierCurveTo(
                        midX, targetY,
                        midX, sourceY,
                        sourceX, sourceY
                    );

                    // 根据依赖服务状态设置线条颜色
                    const depState = serviceStates[depId];
                    if (depState === 'running') {
                        ctx.strokeStyle = 'rgba(74, 222, 128, 0.6)';
                    } else if (depState === 'warning') {
                        ctx.strokeStyle = 'rgba(251, 191, 36, 0.6)';
                    } else {
                        ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                    }

                    ctx.lineWidth = 2;
                    ctx.stroke();
                });
            });
        }

        // 切换服务状态
        function toggleService(serviceId) {
            const currentState = serviceStates[serviceId];

            if (currentState === 'stopped') {
                serviceStates[serviceId] = 'running';
            } else if (currentState === 'running') {
                serviceStates[serviceId] = 'warning';
            } else {
                serviceStates[serviceId] = 'stopped';
            }

            renderServices();
        }

        // 更新统计
        function updateStats() {
            const running = Object.values(serviceStates).filter(s => s === 'running').length;
            const stopped = Object.values(serviceStates).filter(s => s === 'stopped').length;
            const warning = Object.values(serviceStates).filter(s => s === 'warning').length;

            document.getElementById('runningCount').textContent = running;
            document.getElementById('stoppedCount').textContent = stopped;
            document.getElementById('warningCount').textContent = warning;

            const uptime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('uptime').textContent = formatUptime(uptime);
        }

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) {
                return `${hours}h ${minutes}m`;
            } else if (minutes > 0) {
                return `${minutes}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        // 检查所有服务状态（模拟）
        async function checkAllServices() {
            console.log('检查服务状态...');

            // 模拟检查延迟
            for (let service of services) {
                await new Promise(resolve => setTimeout(resolve, 200));

                // 随机分配状态（实际应该通过 HTTP 请求检查）
                const rand = Math.random();
                if (rand > 0.7) {
                    serviceStates[service.id] = 'running';
                } else if (rand > 0.4) {
                    serviceStates[service.id] = 'warning';
                } else {
                    serviceStates[service.id] = 'stopped';
                }

                renderServices();
            }
        }

        // 启动所有服务
        function startAllServices() {
            services.forEach(service => {
                serviceStates[service.id] = 'running';
            });
            renderServices();
        }

        // 停止所有服务
        function stopAllServices() {
            services.forEach(service => {
                serviceStates[service.id] = 'stopped';
            });
            renderServices();
        }

        // 窗口大小改变时重绘连接线
        window.addEventListener('resize', () => {
            drawConnections();
        });

        // 定时更新运行时间
        setInterval(updateStats, 1000);

        // 初始化
        renderServices();

        // 3秒后自动检查状态
        setTimeout(() => {
            checkAllServices();
        }, 3000);
    </script>
</body>
</html>
