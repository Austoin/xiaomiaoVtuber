<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xiaomiaoVirtual 实时监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .dashboard {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 20px;
        }

        .services {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .service-item {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .service-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .service-item:hover::before {
            left: 100%;
        }

        .service-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .service-item.running {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .service-item.stopped {
            border-color: #ef4444;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        .service-item.warning {
            border-color: #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .service-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .service-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-name {
            font-size: 18px;
            font-weight: 600;
        }

        .service-details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        .status-indicator.running {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            animation: pulse-green 2s infinite;
        }

        .status-indicator.stopped {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }

        .status-indicator.warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            animation: pulse-yellow 2s infinite;
        }

        .status-indicator.checking {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            animation: spin 1s linear infinite;
        }

        @keyframes pulse-green {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(16, 185, 129, 0);
            }
        }

        @keyframes pulse-yellow {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7);
            }
            50% {
                box-shadow: 0 0 0 15px rgba(245, 158, 11, 0);
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-value {
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.8) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .legend-dot.running { background: #10b981; }
        .legend-dot.stopped { background: #ef4444; }
        .legend-dot.warning { background: #f59e0b; }

        .last-update {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .dependency-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 11px;
            margin-top: 8px;
        }

        @media (max-width: 768px) {
            .services {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 xiaomiaoVirtual 实时监控面板</h1>
            <div class="subtitle">Service Status Dashboard - Real-time Monitoring</div>
        </div>

        <div class="dashboard">
            <canvas id="connectionCanvas"></canvas>

            <div class="services" id="servicesContainer">
                <!-- 服务项将由 JavaScript 动态生成 -->
            </div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="runningCount">-</div>
                <div class="stat-label">✓ 运行中</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stoppedCount">-</div>
                <div class="stat-label">× 已停止</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="warningCount">-</div>
                <div class="stat-label">⚠ 警告</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="uptimeValue">0s</div>
                <div class="stat-label">⏱ 监控时长</div>
            </div>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-dot running"></div>
                <span>运行正常</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot warning"></div>
                <span>需要注意</span>
            </div>
            <div class="legend-item">
                <div class="legend-dot stopped"></div>
                <span>服务停止</span>
            </div>
        </div>

        <div class="controls">
            <button onclick="checkAllServices()">
                <span>🔄</span>
                <span>刷新状态</span>
            </button>
            <button onclick="toggleAutoRefresh()">
                <span id="autoRefreshIcon">▶️</span>
                <span id="autoRefreshText">开启自动刷新</span>
            </button>
            <button onclick="window.location.href='start-all.cmd'">
                <span>🚀</span>
                <span>启动所有服务</span>
            </button>
        </div>

        <div class="last-update" id="lastUpdate">等待首次检查...</div>
    </div>

    <script>
        // 服务配置（包含依赖关系）
        const services = {
            'napcat': {
                name: 'NapCat (QQ协议)',
                port: '5004',
                dependencies: []
            },
            'agent-api': {
                name: 'xiaomiaoAgent API',
                port: '8900',
                dependencies: []
            },
            'xiaomiao-bridge': {
                name: '小喵桌面桥接',
                port: '5519',
                dependencies: ['agent-api']
            },
            'xiaomiao-bot': {
                name: 'QQ Bot',
                port: '-',
                dependencies: ['napcat', 'agent-api']
            },
            'stage-web': {
                name: 'Web 界面',
                port: '5175',
                dependencies: ['xiaomiao-bridge']
            },
            'stage-tamagotchi': {
                name: '桌面端 (Electron)',
                port: '-',
                dependencies: ['xiaomiao-bridge']
            },
            'tui': {
                name: 'TUI 终端',
                port: '-',
                dependencies: ['agent-api']
            }
        };

        let serviceStates = {};
        let startTime = Date.now();
        let autoRefreshInterval = null;
        let isAutoRefreshing = false;

        // 初始化
        Object.keys(services).forEach(id => {
            serviceStates[id] = 'checking';
        });

        function getStatusIcon(state) {
            switch(state) {
                case 'running': return '✓';
                case 'warning': return '⚠';
                case 'stopped': return '×';
                case 'checking': return '⟳';
                default: return '?';
            }
        }

        function getDependencyText(deps) {
            if (deps.length === 0) return '';
            return deps.map(dep => services[dep]?.name || dep).join(', ');
        }

        function renderServices() {
            const container = document.getElementById('servicesContainer');
            container.innerHTML = '';

            Object.keys(services).forEach(id => {
                const service = services[id];
                const state = serviceStates[id] || 'stopped';

                const item = document.createElement('div');
                item.className = `service-item ${state}`;
                item.id = `service-${id}`;

                const deps = getDependencyText(service.dependencies);

                item.innerHTML = `
                    <div class="service-header">
                        <div class="service-title">
                            <div class="status-indicator ${state}">
                                <span>${getStatusIcon(state)}</span>
                            </div>
                            <div>
                                <div class="service-name">${service.name}</div>
                                ${deps ? `<div class="dependency-badge">依赖: ${deps}</div>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="service-details">
                        <div class="detail-item">
                            <span>📡</span>
                            <span>端口: ${service.port}</span>
                        </div>
                        <div class="detail-item">
                            <span>📊</span>
                            <span>状态: ${state === 'running' ? '运行中' : state === 'stopped' ? '已停止' : state === 'warning' ? '警告' : '检查中'}</span>
                        </div>
                    </div>
                `;

                container.appendChild(item);
            });

            updateStats();
            drawConnections();
        }

        function drawConnections() {
            const canvas = document.getElementById('connectionCanvas');
            const container = document.querySelector('.dashboard');

            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            Object.keys(services).forEach(serviceId => {
                const service = services[serviceId];
                if (service.dependencies.length === 0) return;

                const sourceEl = document.getElementById(`service-${serviceId}`);
                if (!sourceEl) return;

                const sourceRect = sourceEl.getBoundingClientRect();
                const containerRect = container.getBoundingClientRect();

                service.dependencies.forEach(depId => {
                    const targetEl = document.getElementById(`service-${depId}`);
                    if (!targetEl) return;

                    const targetRect = targetEl.getBoundingClientRect();

                    const sourceX = sourceRect.left - containerRect.left + 25;
                    const sourceY = sourceRect.top - containerRect.top + sourceRect.height / 2;
                    const targetX = targetRect.right - containerRect.left - 25;
                    const targetY = targetRect.top - containerRect.top + targetRect.height / 2;

                    ctx.beginPath();
                    ctx.moveTo(targetX, targetY);

                    const midX = (sourceX + targetX) / 2;
                    ctx.bezierCurveTo(
                        midX, targetY,
                        midX, sourceY,
                        sourceX, sourceY
                    );

                    const depState = serviceStates[depId];
                    if (depState === 'running') {
                        ctx.strokeStyle = 'rgba(16, 185, 129, 0.7)';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(16, 185, 129, 0.5)';
                    } else if (depState === 'warning') {
                        ctx.strokeStyle = 'rgba(245, 158, 11, 0.7)';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(245, 158, 11, 0.5)';
                    } else {
                        ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = 'rgba(239, 68, 68, 0.3)';
                    }

                    ctx.lineWidth = 2.5;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                });
            });
        }

        function updateStats() {
            const states = Object.values(serviceStates);
            const running = states.filter(s => s === 'running').length;
            const stopped = states.filter(s => s === 'stopped').length;
            const warning = states.filter(s => s === 'warning').length;

            document.getElementById('runningCount').textContent = running;
            document.getElementById('stoppedCount').textContent = stopped;
            document.getElementById('warningCount').textContent = warning;

            const uptime = Math.floor((Date.now() - startTime) / 1000);
            document.getElementById('uptimeValue').textContent = formatUptime(uptime);
        }

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;

            if (hours > 0) return `${hours}h ${minutes}m`;
            if (minutes > 0) return `${minutes}m ${secs}s`;
            return `${secs}s`;
        }

        async function checkAllServices() {
            showToast('🔄 正在检查服务状态...', 2000);

            // 先设置为检查中
            Object.keys(services).forEach(id => {
                serviceStates[id] = 'checking';
            });
            renderServices();

            try {
                // 尝试从后端 API 获取状态
                const response = await fetch('http://127.0.0.1:8888/api/status');
                const data = await response.json();

                data.services.forEach(service => {
                    if (serviceStates.hasOwnProperty(service.id)) {
                        serviceStates[service.id] = service.status;
                    }
                });

                document.getElementById('lastUpdate').textContent =
                    `最后更新: ${new Date().toLocaleString('zh-CN')}`;

                showToast('✓ 状态检查完成', 2000);
            } catch (error) {
                console.error('无法连接到监控 API:', error);
                // 模拟状态（开发模式）
                await simulateCheck();
                document.getElementById('lastUpdate').textContent =
                    `最后更新: ${new Date().toLocaleString('zh-CN')} (模拟模式)`;
                showToast('⚠ 使用模拟数据', 2000);
            }

            renderServices();
        }

        async function simulateCheck() {
            const serviceIds = Object.keys(services);
            for (let id of serviceIds) {
                await new Promise(resolve => setTimeout(resolve, 100));
                const rand = Math.random();
                serviceStates[id] = rand > 0.7 ? 'running' : rand > 0.4 ? 'warning' : 'stopped';
            }
        }

        function toggleAutoRefresh() {
            isAutoRefreshing = !isAutoRefreshing;

            if (isAutoRefreshing) {
                document.getElementById('autoRefreshIcon').textContent = '⏸️';
                document.getElementById('autoRefreshText').textContent = '停止自动刷新';
                autoRefreshInterval = setInterval(checkAllServices, 5000);
                showToast('✓ 已开启自动刷新 (5秒)', 2000);
            } else {
                document.getElementById('autoRefreshIcon').textContent = '▶️';
                document.getElementById('autoRefreshText').textContent = '开启自动刷新';
                if (autoRefreshInterval) {
                    clearInterval(autoRefreshInterval);
                    autoRefreshInterval = null;
                }
                showToast('× 已停止自动刷新', 2000);
            }
        }

        function showToast(message, duration = 3000) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => toast.remove(), duration);
        }

        // 窗口大小改变时重绘
        window.addEventListener('resize', () => {
            drawConnections();
        });

        // 定时更新运行时间
        setInterval(updateStats, 1000);

        // 初始化
        renderServices();

        // 3秒后自动检查
        setTimeout(checkAllServices, 3000);
    </script>
</body>
</html>
